services:
  - type: web
    name: scraper-legend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scraper-legend-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "False"

databases:
  - name: scraper-legend-db
    region: frankfurt
    plan: free
